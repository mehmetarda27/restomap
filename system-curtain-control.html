<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>RESTOMAP Erişim Kontrolü</title>
  <link rel="stylesheet" href="/system-curtain-control.css">
</head>
<body>
  <main class="control-shell">
    <section class="control-card" aria-labelledby="control-title">
      <div class="brand-mark">D</div>
      <p class="eyebrow">RESTOMAP</p>
      <h1 id="control-title">Erişim kontrolü</h1>
      <p class="description">Bu ekran yalnızca kullanıcı panellerinin üzerindeki perdeyi yönetir. Sipariş, atama, konum ve veritabanı işlemleri çalışmaya devam eder.</p>
      <div class="state-card" id="stateCard" data-state="loading">
        <span class="state-dot" aria-hidden="true"></span>
        <div>
          <span class="state-label">Güncel durum</span>
          <strong id="stateText">Kontrol ediliyor…</strong>
        </div>
      </div>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
      <div class="actions">
        <button class="button button-danger" id="closeSystemButton" type="button">Perdeyi indir</button>
        <button class="button button-success" id="openSystemButton" type="button">Perdeyi kaldır</button>
      </div>
      <p class="footnote">Değişiklik tüm açık admin, restoran ve kurye panellerine birkaç saniye içinde uygulanır.</p>
    </section>
  </main>
  <script src="/system-curtain-control.js" defer></script>
</body>
</html>
