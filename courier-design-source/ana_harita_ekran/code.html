<body class="bg-surface-dim font-body-md text-on-surface h-screen w-screen overflow-hidden flex flex-col antialiased">
<!-- Map Canvas (Background) -->
<div class="absolute inset-0 z-0 map-bg">
</div>
<!-- Top Navigation & Controls Layer (Floating over map) -->
<div class="relative z-10 p-margin-page pt-12 flex flex-col gap-4">
<!-- Top Bar -->
<div class="flex justify-between items-center gap-3">
<!-- Left Action (Time/Status) -->
<button class="w-[56px] h-[56px] bg-secondary text-white rounded-xl shadow-lg flex items-center justify-center transition-transform active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">schedule</span>
</button>
<!-- Main Header Card -->
<div class="flex-1 bg-primary text-white rounded-xl shadow-lg flex items-center justify-between px-4 h-[56px]">
<div class="flex items-center gap-3 min-w-0">
<img src="/assets/restomap-package-logo.png?v=1" alt="RESTOMAP" class="rounded-lg object-cover border border-white/30 shadow-sm shrink-0" style="width:36px;height:36px;object-fit:contain;flex:0 0 36px"/>
<span class="font-headline-md text-headline-md truncate">Deneme 123</span>
</div>
<div class="bg-white/20 rounded-lg px-3 py-1 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">local_shipping</span>
<span class="font-label-numeric text-label-numeric font-bold">0</span>
</div>
</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
</button>
</div>

<div class="flex justify-center -mt-2">
<div class="bg-white px-4 py-1.5 rounded-full shadow-md flex items-center gap-2 border border-surface-container-high">
<div class="w-2.5 h-2.5 rounded-full bg-secondary"></div>
<span class="font-label-numeric text-caption font-bold text-secondary tracking-wider">MÜSAİT</span>
</div>
</div>
</div>
<!-- Right Side Menu (Floating) -->
<div class="absolute right-4 top-1/3 z-20 flex flex-col gap-3">

<div class="absolute -left-6 top-1/2 -translate-y-1/2 w-8 h-8 bg-surface-container-highest rounded-full flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
</div>
<div class="bg-white rounded-2xl shadow-xl p-3 flex flex-col gap-3 w-[140px] border border-surface-container-highest">

<button class="relative w-full border border-primary text-primary rounded-lg py-2 flex flex-col items-center justify-center gap-1 hover:bg-primary/5 transition-colors">
<span class="absolute -top-2 -right-2 w-5 h-5 bg-tertiary text-white text-[10px] font-bold rounded-full flex items-center justify-center shadow-sm">3</span>
<span class="material-symbols-outlined">inbox</span>
<span class="font-body-md text-caption font-semibold">Havuz</span>
</button>

<span class="font-body-md text-caption font-semibold">Sistem Dışı</span>
</button>

<span class="font-body-md text-caption font-semibold leading-tight text-center">Yönetici<br/>Ara</span>
</button>
</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">package_2</span>
